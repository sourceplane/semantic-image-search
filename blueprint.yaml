# The semantic-image-search card: what the console's Blueprints page renders and the
# platform's bootstrap door consumes.
#
# THIS FILE IS NOT THE BUILD. `spec.bootstrap.blueprint` names the build
# document — `repo-blueprint.yaml`, whose phases a runner places. This card is
# what an operator reads and fills in before pressing Build, and
# `testing/manifest.test.sh` compares every list below to the document that
# actually does the thing, not to a copy of itself.
#
# The division of labour with the registry is strict: the registry (orun-cloud
# `infra/baselines-registry/baselines.yaml`) owns identity and commerce — id,
# visibility, tier, the pinned tag. This file owns the build contract. Neither
# restates the other, which is why there is no `tag` here: this file is
# fetched AT the tag the registry pins.
apiVersion: orun.io/v1
kind: Blueprint
metadata:
  name: semantic-image-search
  displayName: Semantic Image Search — search images by meaning, on Workers AI, R2 and Supabase
  description: >
    Vercel's Semantic Image Search as a product of its own: a gallery you
    search by what the images show, not by their file names. A vision model
    on Workers AI titles and describes every image, the description is
    embedded, and a search is ranked by cosine similarity in pgvector beside a
    direct match on the words. The images live in an R2 bucket, the search
    cache in Workers KV, and the embeddings in a Supabase project's Postgres
    reached through Hyperdrive. OpenNext builds it into one Cloudflare Worker,
    which indexes its images itself, through its own bindings, on every
    deploy, so it needs no AI vendor key. Terraform creates the project, the
    Hyperdrive config, the bucket and the namespace per environment,
    db-migrate applies the schema, and CI deploys it all to stage and prod on
    merge, in that order, with twelve sample images indexed. It creates TWO
    Supabase projects, stage and prod: the organization needs room for both
    (Supabase's free plan allows two active projects per organization). Live
    in about nineteen minutes.
  tags: [ai, image-search, embeddings, pgvector, workers-ai, supabase, r2, nextjs]
spec:
  source:
    repo: sourceplane/semantic-image-search
    # No `tag`. The registry pins it; this file is fetched at it.

  # ── What the operator reads first ────────────────────────────────────────
  overview:
    lede: >
      Search images by what they show. Workers AI describes and embeds every
      image in the bucket on each deploy, pgvector ranks a search by meaning,
      and no AI vendor key is needed.
    architecture:
      - layer: Edge
        items: [web, Workers AI, Workers KV search cache]
      - layer: Data
        items: [Supabase Postgres with pgvector, Hyperdrive, R2 image bucket, db-migrate]
      - layer: Delivery
        items: [Terraform, GitHub Actions, OpenNext]
    outcome:
      - Live on stage and prod with twelve sample images indexed
      - Search by meaning with no AI vendor key
      - Add your own images to the bucket and they are indexed on the next deploy
      - The search cache follows the index and never hides a new image

  requires:
    # GitHub arrives as the App installation plus the repo link; Cloudflare
    # and Supabase are the two provider connections the build mints from.
    # No AI vendor is here: both models are Workers AI's, reached through the
    # Worker's AI binding in the Cloudflare account the app deploys into.
    integrations: [github, cloudflare, supabase]
    apiKeyRole: admin          # secret writes need the admin floor

  # Every input is collected by the console: keys are lowercase (the
  # platform's reader refuses anything else), every one carries the `pattern`
  # its value is checked against before Continue, and a value the console
  # already holds says so with `from`. repo-blueprint.yaml declares the same
  # names; `repoPrivate`, `orunWorkspace` and `epicSlug` are build inputs with
  # defaults (or filled from the build's workspace) and are not asked.
  #
  # NOR IS THE DOMAIN. The product goes live on workers.dev, and a domain is an
  # owner's step after the bootstrap: `productdomain` defaults to empty, the
  # rebrand writes the reserved placeholder `<reponame>.example.com` where
  # the domain goes, and the product's README ("Custom domain") says how to set
  # it. Nothing that needs a domain is removed — it waits for one.
  inputs:
    - key: reponame
      label: Repo name
      pattern: "^[a-z][a-z0-9-]{1,38}$"
      # The operator picked the repository; its name IS this value.
      from: repo.name
    - key: productname
      label: Product name
      pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'&-]{1,48}$"
      help: The name people see — the page's title and heading, in every tab and bookmark.
      example: Acme Gallery
    - key: githuborg
      label: GitHub organisation
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
      help: The GitHub org or user the product's repository is created under.
      # DERIVED FROM THE CHOSEN REPOSITORY: its owner IS this value. Declared
      # because repo-blueprint.yaml requires it — a build may declare more
      # inputs than this card, but not require one nobody supplies.
      from: repo.owner
    - key: subdomain
      label: workers.dev subdomain
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      help: The workers.dev subdomain of the Cloudflare account the app deploys into.
      example: acme
      # READ FROM THE CLOUDFLARE CONNECTION, not asked. The subdomain belongs
      # to the account the same way its id does, and there is exactly one
      # right answer — a typed one could only be wrong, and wrong showed up
      # after deploy, in the public origin the Open Graph image link is built
      # from, the deploy's smoke, the phase probes and the verify URLs below.
      # The integration reads it from Cloudflare at connect and on its hourly
      # health check; the bootstrap door fills this input from the connection
      # the build is BOUND to, the same one CLOUDFLARE_ACCOUNT_ID and the
      # deploy tokens mint from, so all three name one account. The console
      # renders no field for it. An account with no workers.dev subdomain
      # refuses the build at the door, naming the fix, before anything is
      # created.
      from: connection.cloudflare.workersSubdomain

  # ── PREVIEW ONLY. repo-blueprint.yaml's `orun.integrations/reconcile@v1`
  # hooks mint these, brokered, during 01-product — one hook per provider. ─
  # Transcribed from those hooks' own `provider:` and `secrets:` ({key,
  # template}) values, in their order, so testing/manifest.test.sh compares
  # this list to the document that mints them. The console renders them
  # read-only: no credential is ever typed, shown or stored. Keys that
  # already exist are kept. Six keys, six scopes, on purpose — the deploy
  # token deliberately cannot touch Hyperdrive or R2. No AI key is here:
  # Workers AI is the account's own.
  secrets:
    - key: CLOUDFLARE_API_TOKEN
      provider: cloudflare
      template: workers-deploy
      why: Deploys the app's Worker and its static assets, and applies the KV namespace
    - key: CLOUDFLARE_HYPERDRIVE_TOKEN
      provider: cloudflare
      template: hyperdrive-edit
      why: Hyperdrive — the deploy token deliberately cannot touch it
    - key: CLOUDFLARE_R2_TOKEN
      provider: cloudflare
      template: r2-data
      why: Applies the image bucket — the deploy token deliberately carries no R2
    - key: CLOUDFLARE_ACCOUNT_ID
      provider: cloudflare
      template: account-id
      why: Connection fact, not a secret
      fact: true
    - key: SUPABASE_ACCESS_TOKEN
      provider: supabase
      template: management-access
      why: Project create and migrations
    - key: SUPABASE_ORG_ID
      provider: supabase
      template: org-id
      why: Connection fact, not a secret
      fact: true

  # ── PREVIEW ONLY. repo-blueprint.yaml's run-level `hooks.preInstantiate`
  # opens these — the epic, every milestone in this order, every task — before
  # the first phase places. Idempotent by identity, so a re-run finds what it
  # made before.
  programme:
    epicSlug: images-baselining           # = repo-blueprint.yaml's `epicSlug` default
    epicName: "Semantic Image Search baselining — {productname}"
    milestones:
      - name: 01-product
      - name: 02-docs

  bootstrap:
    # THE BUILD DOCUMENT. There is no umbrella workflow and no agent brief:
    # every phase is declared in it and orun runs it.
    blueprint: repo-blueprint.yaml
    # Summed from the phases' expectedMinutes (18 + 1). An estimate until a
    # bootstrap measures it: a Supabase project takes five to seven minutes to
    # come up, the app's deploy waits on it, on Hyperdrive, on the migrations,
    # the bucket and the namespace, and its smoke indexes the sample images.
    expectedMinutes: 19
    tokenChannel: ORUN_TOKEN_FILE   # how a runner hands over its refreshed token
  verify:
    urls:
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev"
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev/api/health"
    envs: [stage, prod]
